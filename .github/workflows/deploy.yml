name: Production Deploy & Migrations

on:
  push:
    branches: [ "main", "master" ]

jobs:
  database-migration:
    name: Pre-Flight Database Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Migrations (Production Check)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "Executando validação e migrações controladas..."
          npx prisma migrate deploy --schema backend/prisma/schema.prisma

  deploy:
    name: Deploy to Production & Rollback Trigger
    needs: database-migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application Service
        run: |
          echo "Simulando deploy na infraestrutura de produção..."

      - name: Health Check & Rollback Trigger
        if: failure()
        run: |
          echo " Falha detectada no deploy ou healthcheck! Acionando procedimento de rollback..."
          exit 1