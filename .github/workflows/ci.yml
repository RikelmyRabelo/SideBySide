name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-ci:
    name: Backend CI & Test
    runs-on: ubuntu-latest
    environment: ci
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Migrations / Push Schema
        run: npx prisma db push

      - name: Run Backend Tests
        run: npm test --if-present

  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test --if-present

      - name: Build Frontend
        run: npm run build:frontend

  e2e-tests:
    name: Playwright E2E Tests
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    environment: ci


    # 1. Sobe um container de banco para o backend se conectar durante o E2E

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: "redis://127.0.0.1:6379"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sobe o Redis diretamente na rede nativa do host (evita problemas de bridge/iptables)
      - name: Start Redis (Host Network)
        run: |
          docker run -d --network host --name test-redis redis:alpine
          sleep 2
          docker exec test-redis redis-cli ping

      - name: Install Root Dependencies
        run: npm install --include=dev

      - name: Setup Backend & Database Schema
        working-directory: ./backend
        run: |
          npm install
          npx prisma generate
          npx prisma db push

      # Instala dependências da raiz / frontend
      - name: Install Root Dependencies
        run: npm ci

      # 2. Instala dependências do backend e sincroniza o Prisma com o banco
      - name: Setup Backend & Database Schema
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma db push

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 3. Roda os testes com a variável de ambiente disponível
      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: "redis://127.0.0.1:6379"
        run: npm run test:e2e

      # Salva o relatório de testes do Playwright como artefato
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30