name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-ci:
    name: Backend CI & Test
    runs-on: ubuntu-latest
    environment: ci

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Environment Variables
        run: |
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"
          test "${#JWT_SECRET}" -ge 32
          test -n "$REDIS_URL"
          echo "Environment variables configured successfully."

      - name: Generate Prisma Client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Run Backend Tests
        run: npm test --workspace=backend --if-present

  frontend-ci:
    name: Frontend CI & Test
    runs-on: ubuntu-latest
    environment: ci

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test --if-present

      - name: Build Frontend
        run: npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: ci

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: redis://localhost:6379

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify Environment Variables
        run: |
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"
          test "${#JWT_SECRET}" -ge 32
          test -n "$REDIS_URL"
          echo "Environment variables configured successfully."

      - name: Debug Environment
        run: |
          echo "CI=$CI"
          echo "DATABASE_URL configured: ${DATABASE_URL:+yes}"
          echo "JWT_SECRET configured: ${JWT_SECRET:+yes}"
          echo "REDIS_URL configured: ${REDIS_URL:+yes}"

      - name: Verify Node Environment
        run: |
          node -e "console.log('DATABASE_URL configured in Node:', Boolean(process.env.DATABASE_URL))"
          node -e "console.log('JWT_SECRET configured in Node:', Boolean(process.env.JWT_SECRET))"
          node -e "console.log('REDIS_URL configured in Node:', Boolean(process.env.REDIS_URL))"

      - name: Run Playwright E2E Tests
        run: npx playwright test